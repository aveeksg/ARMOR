name: ARMOR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify CLI entry point and version
        run: |
          armor --version
          python skills/armor/scripts/armor_run.py --version

      - name: Verify PostureReport JSON Schema is in sync
        run: |
          armor pipeline . --write-schema
          git diff --exit-code skills/armor/scripts/armor/pipeline/schemas/posture_report.schema.json

      - name: Run 40-test pytest suite
        run: python -m pytest skills/armor/assets/tests -v
