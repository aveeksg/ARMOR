name: "ARMOR AI-Guardrail Posture Gate"
description: "Validate an ARMOR v6 AI-guardrail posture report (.armor/reports/posture_latest.json) and enforce pass/warn/fail gate rules."
author: "Aveek Sengupta"

inputs:
  project-root:
    description: "Path to the target project directory containing .armor/reports/posture_latest.json"
    required: false
    default: "."
  fail-on-warn:
    description: "Fail the check if verdict is 'warn' (weak guardrails or open questions present)"
    required: false
    default: "false"
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"

outputs:
  verdict:
    description: "Computed deterministic verdict: pass, warn, or fail"
    value: ${{ steps.gate.outputs.verdict }}
  overall-pct:
    description: "Overall in-scope guardrail coverage percentage"
    value: ${{ steps.gate.outputs.overall_pct }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ARMOR
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}"

    - name: Validate PostureReport Schema & Enforce Verdict Gate
      id: gate
      shell: bash
      env:
        TARGET_PROJECT: ${{ inputs.project-root }}
        FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
      run: |
        # 1. Validate against strict Pydantic PostureReport schema
        armor pipeline "$TARGET_PROJECT" --validate-report

        # 2. Compute deterministic verdict (matching armor-agent.md §11.4) and write Job Summary
        python - << 'EOF'
        import json, os, sys
        from pathlib import Path

        proj = Path(os.environ["TARGET_PROJECT"]).resolve()
        fail_on_warn = os.environ.get("FAIL_ON_WARN", "false").lower() == "true"

        rep_path = proj / ".armor" / "reports" / "posture_latest.json"
        md_path = proj / ".armor" / "reports" / "posture_latest.md"
        hal_path = proj / ".armor" / "hallucination_log.jsonl"

        rep = json.loads(rep_path.read_text(encoding="utf-8"))
        totals = rep.get("totals", {})
        by_v = totals.get("by_verdict", {})
        cov = rep.get("coverage", {})

        gaps = int(totals.get("gaps", 0))
        weak = int(by_v.get("weak", 0))
        open_q = int(totals.get("open_questions", 0))
        demoted = sum(1 for r in rep.get("rows", []) if r.get("demoted_due_to_hallucination"))

        if gaps > 0 or demoted > 0:
            verdict = "fail"
        elif weak > 0 or open_q > 0:
            verdict = "warn"
        else:
            verdict = "pass"

        overall_pct = cov.get("overall_pct", 0.0)
        print(f"ARMOR Verdict: {verdict.upper()} (coverage={overall_pct}%, gaps={gaps}, weak={weak}, demoted_rows={demoted}, open_questions={open_q})")

        gh_out = os.environ.get("GITHUB_OUTPUT")
        if gh_out:
            with open(gh_out, "a", encoding="utf-8") as f:
                f.write(f"verdict={verdict}\n")
                f.write(f"overall_pct={overall_pct}\n")

        gh_summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if gh_summary and md_path.is_file():
            with open(gh_summary, "a", encoding="utf-8") as f:
                f.write(f"## ARMOR Gate Verdict: `{verdict.upper()}`\n\n")
                f.write(md_path.read_text(encoding="utf-8"))

        if verdict == "fail" or (verdict == "warn" and fail_on_warn):
            sys.exit(1)
        EOF
